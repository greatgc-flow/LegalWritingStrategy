name: Publish V5 release
on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'greatgc-flow/LegalWritingStrategy' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and build immutable allowlisted archive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r requirements.txt
          python scripts/verify_package.py --check-line-endings
          python scripts/score.py
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python scripts/mode_plan.py --check
          VERSION="$(cat VERSION)"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          python scripts/build_release.py --ref "$GITHUB_SHA" --out "$RUNNER_TEMP/LegalWritingStrategy-${VERSION}.zip"
      - name: Publish existing verified artifact only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. No overwrite."
            exit 0
          fi
          gh release create "$VERSION" "$RUNNER_TEMP/LegalWritingStrategy-${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "LegalWritingStrategy ${VERSION}" \
            --notes-file RELEASE_NOTES.md

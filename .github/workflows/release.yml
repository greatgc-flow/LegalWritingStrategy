name: Publish V5 release
on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'greatgc-flow/LegalWritingStrategy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish release from reviewed source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. No overwrite."
            exit 0
          fi
          python3 scripts/verify_package.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          zip -qr "LegalWritingStrategy-${VERSION}.zip" . -x '.git/*' '.github/*' '.venv/*'
          gh release create "$VERSION" "LegalWritingStrategy-${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "LegalWritingStrategy ${VERSION}" \
            --notes-file RELEASE_NOTES.md

name: Structural and synthetic QA
on:
  push:
    branches: [main, 'audit/**']
  pull_request:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrity, links, and synthetic regression
        run: |
          python scripts/verify_package.py
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python scripts/strategy_qa.py --record examples/synthetic_strategy_case.json
          python scripts/legal_qa.py --record examples/synthetic_case.json

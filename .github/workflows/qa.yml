name: Structural and synthetic QA
on:
  push:
    branches: [main, 'audit/**']
  pull_request:
permissions:
  contents: read
jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require LF without conversion warnings
        run: |
          git config --global core.autocrlf false
          git config --global core.safecrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scored dependencies
        run: python -m pip install -r requirements.txt
      - name: Integrity, links, and synthetic regression
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_package.py --check-line-endings
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python scripts/strategy_qa.py --record examples/synthetic_strategy_case.json
          python scripts/legal_qa.py --record examples/synthetic_case.json
          python scripts/score.py
